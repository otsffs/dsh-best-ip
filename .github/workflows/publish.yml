name: Publish

# Trusted Publishing: npm authenticates this workflow through GitHub OIDC, so no
# NPM_TOKEN secret is stored in the repository. Configure it on npm first
# (package Settings -> Trusted Publisher -> GitHub Actions):
#   owner: otsffs   repository: dsh-best-ip   workflow: publish.yml
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for OIDC; never replace with a stored token

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/

      # Trusted publishing needs npm >= 11.5.1. Node 22 still ships npm 10,
      # which cannot exchange the OIDC token and would fail with ENEEDAUTH.
      - name: Ensure npm supports trusted publishing
        run: |
          set -euo pipefail
          npm install --global npm@11
          node -e "const [major, minor] = require('child_process').execSync('npm --version').toString().trim().split('.').map(Number); if (major < 11 || (major === 11 && minor < 5)) { throw new Error('npm too old for trusted publishing'); }"

      - name: Verify tag matches package version
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${version}" >&2
            exit 1
          fi
          echo "Publishing ${version}"

      - run: npm run check
      - run: npm test
      - run: npm run check:package

      # prepack reruns the same checks. --provenance attaches the OIDC-signed
      # build attestation. An already-published version fails this step.
      - run: npm publish --access public --provenance
